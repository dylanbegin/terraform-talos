machine:
  features:
    kubePrism:
      enabled: true
      port: 7445
    hostDNS:
      enabled: false
      forwardKubeDNSToHost: false
  kubelet:
    extraConfig:
      serverTLSBootstrap: true
    extraArgs:
      rotate-server-certificates: true
  install:
    image: ${talos-install}
    #disable wipe to keep longhorn v1 storage
    wipe: false
    disk: /dev/sda #root disk

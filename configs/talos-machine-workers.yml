machine:
  features:
    kubePrism:
      enabled: true
      port: 7445
    hostDNS:
      enabled: false
      forwardKubeDNSToHost: false
  kernel:
    modules: #longhorn v2 engine
      - name: nvme_tcp
      - name: vfio_pci
      - name: uio_pci_generic
      - name: ublk_drv
  kubelet:
    extraConfig:
      serverTLSBootstrap: true
    extraArgs:
      rotate-server-certificates: true
  install:
    image: ${talos-install}
    #disable wipe to keep longhorn v1 storage
    wipe: false
    disk: /dev/sda #root disk
  sysctls: #longhorn v2 engine
    vm.nr_hugepages: "1024"
